<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <style>
    body { font-family: system-ui, sans-serif; width: 260px; padding: 12px; margin: 0; }
    label { display: block; font-size: 12px; margin-bottom: 4px; }
    input { width: 100%; box-sizing: border-box; padding: 6px; margin-bottom: 8px; }
    button { width: 100%; padding: 8px; cursor: pointer; }
    #result { margin-top: 10px; font-size: 12px; word-break: break-all; }
  </style>
</head>
<body>
  <label for="name">Seu nome</label>
  <input id="name" placeholder="Ex: Gabriel" />
  <button id="create">Criar sala</button>
  <div id="result"></div>
  <button id="copy" hidden>Copiar link</button>
  <script src="popup.js"></script>
</body>
</html>
